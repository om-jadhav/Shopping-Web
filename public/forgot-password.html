<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — IDKClothing</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-wrap" style="justify-content: center;">
    <div class="auth-form-panel" style="max-width: 450px; width: 100%;">
      <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="auth-card-subtitle">Enter your email to receive a recovery link</p>
        <form id="forgotForm">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="Enter your email" required style="width: 100%; padding: 10px;" />
          </div>
          <button type="submit" id="submitBtn" class="auth-submit" style="width: 100%; margin-top: 15px;">Send Reset Link</button>
          <div id="msg" class="message"></div>
        </form>
        <p class="switch-link" style="text-align: center; margin-top: 15px;"><a href="/login.html">Back to Login</a></p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("msg");
      try {
        const res = await apiPost("/auth/forgot-password", { email });
        showMessage(msg, res.message, "success");
      } catch (err) {
        showMessage(msg, err.message, "error");
      }
    });
  </script>
</body>
</html>
