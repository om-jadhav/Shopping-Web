<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Password — IDKClothing</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-wrap" style="justify-content: center;">
    <div class="auth-form-panel" style="max-width: 450px; width: 100%;">
      <div class="auth-card">
        <h1>Set New Password</h1>
        <p class="auth-card-subtitle">Enter your new secure password</p>
        <form id="resetForm">
          <div class="input-group">
            <label for="password">New Password</label>
            <input id="password" type="password" placeholder="Enter new password" required style="width: 100%; padding: 10px;" />
          </div>
          <button type="submit" id="submitBtn" class="auth-submit" style="width: 100%; margin-top: 15px;">Update Password</button>
          <div id="msg" class="message"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/api.js"></script>
  <script>
    // Supabase automatically parses tokens from URL hash when landing from email
    const supabaseClient = window.supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      try {
        const sessionData = await supabaseClient.auth.getSession();
        const token = sessionData.data.session?.access_token;

        const res = await fetch("/api/auth/update-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showMessage(msg, "Password updated successfully! Redirecting...", "success");
        setTimeout(() => window.location.href = "/login.html", 1500);
      } catch (err) {
        showMessage(msg, err.message, "error");
      }
    });
  </script>
</body>
</html>
