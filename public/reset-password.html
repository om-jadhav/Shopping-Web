<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Password — IDKClothing</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>

<body class="auth-page">
  <div class="auth-wrap" style="justify-content: center;">
    <div class="auth-form-panel" style="max-width: 450px; width: 100%;">
      <div class="auth-card">
        <h1>Set New Password</h1>
        <p class="auth-card-subtitle">Enter your new secure password</p>
        <form id="resetForm">
          <div class="input-group">
            <label for="password">New Password</label>
            <input id="password" type="password" placeholder="Enter new password" required
              style="width: 100%; padding: 10px;" />
          </div>
          <button type="submit" id="submitBtn" class="auth-submit" style="width: 100%; margin-top: 15px;">Update
            Password</button>
          <div id="msg" class="message"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      const msg = document.getElementById("msg");
      const submitBtn = document.getElementById("submitBtn");
      let supabaseClient = null;
      let recoveryToken = null;

      // Attach the listener FIRST, before any await/fetch that could fail,
      // so the button is never left unresponsive.
      document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;

        if (!recoveryToken) {
          showMessage(msg, "This reset link is invalid or has expired. Please request a new one.", "error");
          return;
        }

        submitBtn.disabled = true;
        try {
          const res = await fetch("/api/auth/update-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${recoveryToken}`
            },
            body: JSON.stringify({ password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Could not update password.");

          showMessage(msg, "Password updated successfully! Redirecting…", "success");
          setTimeout(() => window.location.href = "/login.html", 1500);
        } catch (err) {
          showMessage(msg, err.message, "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      // Now safely set up the Supabase client and capture the recovery session.
      try {
        const res = await fetch("/api/config/supabase");
        const config = await res.json();
        if (!config.url || !config.anonKey) {
          showMessage(msg, "Auth service unavailable. Please try again shortly.", "error");
          return;
        }

        supabaseClient = window.supabase.createClient(config.url, config.anonKey, {
          auth: { persistSession: true, detectSessionInUrl: true },
        });

        const code = new URLSearchParams(window.location.search).get("code");
        if (code) {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
          if (!error && data?.session?.access_token) recoveryToken = data.session.access_token;
        } else {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session?.access_token) recoveryToken = session.access_token;
        }

        window.history.replaceState({}, document.title, window.location.pathname);

        if (!recoveryToken) {
          showMessage(msg, "This reset link is invalid or has expired. Please request a new one.", "error");
        }
      } catch (err) {
        showMessage(msg, "Could not verify reset link: " + err.message, "error");
      }
    })();
  </script>
</body>

</html>
